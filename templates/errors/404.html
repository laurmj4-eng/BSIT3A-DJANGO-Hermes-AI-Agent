<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1020" media="(prefers-color-scheme: dark)" />
    <title>Page not found · Hermes AI News Agent</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tabler-theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-bs-theme', saved);
            document.documentElement.style.colorScheme = saved;
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f4fb;
        --surface: #ffffff;
        --ink: #232741;
        --muted: #5b627f;
        --line: #e8eaf4;
        --brand: #6366f1;
        --brand-ink: #ffffff;
        --brand-text: #4f46e5;
        --accent: #f5a524;
        --soft: #eef0fa;
      }
      [data-bs-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1020;
        --surface: #161a30;
        --ink: #e6e8f4;
        --muted: #a6adc8;
        --line: rgba(255, 255, 255, 0.09);
        --brand: #7c82f5;
        --brand-ink: #0e1020;
        --brand-text: #a5b4fc;
        --soft: #1e2340;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-bs-theme="light"]) {
          color-scheme: dark;
          --bg: #0e1020;
          --surface: #161a30;
          --ink: #e6e8f4;
          --muted: #a6adc8;
          --line: rgba(255, 255, 255, 0.09);
          --brand: #7c82f5;
          --brand-ink: #0e1020;
          --brand-text: #a5b4fc;
          --soft: #1e2340;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
      }
      main {
        width: 100%;
        max-width: 34rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        padding: clamp(1.75rem, 5vw, 2.75rem);
        text-align: center;
        box-shadow: 0 24px 60px -40px rgba(7, 11, 24, 0.65);
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3.5rem;
        height: 3.5rem;
        margin-bottom: 1.1rem;
        border-radius: 1rem;
        background: #4f46e5;
        color: #ffffff;
        box-shadow: 0 10px 24px -18px rgba(7, 11, 24, 0.6);
      }
      .mark svg { width: 1.75rem; height: 1.75rem; }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.55rem, 4vw, 2rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        text-wrap: balance;
      }
      .code {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0 0 1rem;
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        background: var(--soft);
        color: var(--brand-text);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      p { margin: 0 0 1.25rem; color: var(--muted); }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      a.btn, button.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.5rem;
        padding: 0.5rem 1.2rem;
        border-radius: 0.65rem;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid transparent;
        cursor: pointer;
      }
      a.btn:focus-visible, button.btn:focus-visible {
        outline: 2px solid var(--brand-text);
        outline-offset: 2px;
      }
      .btn-primary { background: var(--brand); color: var(--brand-ink); }
      .btn-primary:hover { filter: brightness(0.95); }
      .btn-outline { background: transparent; color: var(--brand-text); border-color: var(--line); }
      .btn-outline:hover { background: var(--soft); }
      .note {
        margin: 0 0 1.25rem;
        padding: 0.65rem 0.8rem;
        font-size: 0.875rem;
        color: var(--ink);
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 0.65rem;
      }
      .saved {
        margin: 1.5rem 0 0;
        text-align: left;
        border-top: 1px solid var(--line);
        padding-top: 1.1rem;
      }
      .saved h2 { margin: 0 0 0.6rem; font-size: 1rem; }
      .saved-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.45rem; }
      .saved-list a {
        display: block;
        padding: 0.55rem 0.75rem;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 0.55rem;
        color: var(--brand-text);
        text-decoration: none;
        font-size: 0.875rem;
        overflow-wrap: anywhere;
      }
      .saved-list a:hover { text-decoration: underline; }
      .saved-empty { margin: 0; color: var(--muted); font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="7" width="16" height="12" rx="3" />
          <path d="M12 3v4M9 13h.01M15 13h.01M9 16.5h6" />
        </svg>
      </span>
      <h1>Page not found</h1>
      <p class="code">HTTP 404</p>
      <p>The page you are looking for doesn't exist or may have been moved.</p>
      <nav class="actions" aria-label="Recovery links">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-outline" href="/news/">Latest news</a>
      </nav>
    </main>
  </body>
</html>
