<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Hermes AI News Agent</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f6fc;
        color: #1d273b;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 30rem;
        background: #ffffff;
        border: 1px solid #e6e8eb;
        border-radius: 0.5rem;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      }
      .code {
        margin: 0 0 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #667085;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #667085; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      a.btn {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 0.375rem;
        font: inherit;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid transparent;
      }
      a.btn:focus-visible { outline: 2px solid #206bc4; outline-offset: 2px; }
      .btn-primary { background: #206bc4; color: #ffffff; }
      .btn-primary:hover { background: #1a569d; }
      .btn-outline { background: transparent; color: #206bc4; border-color: #206bc4; }
      .btn-outline:hover { background: #eef4fb; }
      @media (prefers-color-scheme: dark) {
        body { background: #16191f; color: #e6e9ef; }
        main { background: #1f242e; border-color: #2e3440; box-shadow: none; }
        p, .code { color: #99a1b3; }
        .btn-outline { color: #6ea8fe; border-color: #6ea8fe; }
        .btn-outline:hover { background: #232a36; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for doesn't exist or may have been moved.</p>
      <nav class="actions" aria-label="Recovery links">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-outline" href="/news/">Latest news</a>
      </nav>
    </main>
  </body>
</html>
