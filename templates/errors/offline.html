<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline · Hermes AI News Agent</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #24292f;
      }
      .wrap {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      .wrap h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      .wrap p {
        margin: 0 0 1.5rem;
        color: #667085;
      }
      button {
        padding: 0.5rem 1.25rem;
        font: inherit;
        border: 0;
        border-radius: 0.5rem;
        background: #4c6ef5;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #3b5bdb;
      }
      button:focus-visible {
        outline: 2px solid #4c6ef5;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #16191f;
          color: #e6e9ef;
        }
        .wrap p {
          color: #99a1b3;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>You are offline</h1>
      <p>
        It looks like you've lost your internet connection.
        Check your network and try again.
      </p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
    </script>
  </body>
</html>
