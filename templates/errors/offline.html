<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You are offline · Hermes AI News Agent</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f6fc;
        color: #1d273b;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 30rem;
        background: #ffffff;
        border: 1px solid #e6e8eb;
        border-radius: 0.5rem;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      }
      .code {
        margin: 0 0 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #667085;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0 0 1rem; color: #667085; }
      .note {
        margin: 0 0 1.5rem;
        padding: 0.625rem 0.75rem;
        font-size: 0.875rem;
        color: #1d273b;
        background: #eef4fb;
        border: 1px solid #cfe0f5;
        border-radius: 0.375rem;
      }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      a.btn, button.btn {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 0.375rem;
        font: inherit;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid transparent;
        cursor: pointer;
      }
      a.btn:focus-visible, button.btn:focus-visible { outline: 2px solid #206bc4; outline-offset: 2px; }
      .btn-primary { background: #206bc4; color: #ffffff; }
      .btn-primary:hover { background: #1a569d; }
      .btn-outline { background: transparent; color: #206bc4; border-color: #206bc4; }
      .btn-outline:hover { background: #eef4fb; }
      .saved {
        margin: 0 0 1.5rem;
        text-align: left;
        border-top: 1px solid #e6e8eb;
        padding-top: 1rem;
      }
      .saved h2 { margin: 0 0 0.5rem; font-size: 1rem; }
      .saved-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
      .saved-list a {
        display: block;
        padding: 0.5rem 0.75rem;
        background: #eef4fb;
        border: 1px solid #cfe0f5;
        border-radius: 0.375rem;
        color: #206bc4;
        text-decoration: none;
        font-size: 0.875rem;
        overflow-wrap: anywhere;
      }
      .saved-list a:hover { background: #e2ecf9; }
      .saved-empty { margin: 0; color: #667085; font-size: 0.875rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #16191f; color: #e6e9ef; }
        main { background: #1f242e; border-color: #2e3440; box-shadow: none; }
        p, .code { color: #99a1b3; }
        .note { color: #e6e9ef; background: #232a36; border-color: #2e3440; }
        .saved { border-top-color: #2e3440; }
        .saved-list a { background: #232a36; border-color: #2e3440; color: #6ea8fe; }
        .saved-list a:hover { background: #2a3242; }
        .saved-empty { color: #99a1b3; }
        .btn-outline { color: #6ea8fe; border-color: #6ea8fe; }
        .btn-outline:hover { background: #232a36; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Offline</p>
      <h1>You are offline</h1>
      <p>It looks like you've lost your internet connection, so this page can't be loaded right now.</p>
      <p class="note">Articles you saved for offline reading are still available without a connection.</p>
      <nav class="actions" aria-label="Recovery links">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-outline" href="/news/">Latest news</a>
        <button class="btn btn-outline" type="button" id="retry">Retry</button>
      </nav>
      <section class="saved" id="saved" hidden>
        <h2>Saved for offline reading</h2>
        <ul class="saved-list" id="savedList"></ul>
        <p class="saved-empty" id="savedEmpty">No saved articles cached yet</p>
      </section>
    </main>
    <script>
      (function () {
        var retryBtn = document.getElementById('retry');
        if (retryBtn) {
          retryBtn.addEventListener('click', function () {
            location.reload();
          });
        }

        var SAVED_KEY = 'hermes_saved_articles_v1';
        var SAVED_MAX = 200;

        function loadSaved() {
          var raw = null;
          try { raw = localStorage.getItem(SAVED_KEY); } catch (e) { return []; }
          var parsed = [];
          if (raw) {
            try { parsed = JSON.parse(raw); } catch (e) { parsed = []; }
          }
          if (!Array.isArray(parsed)) { return []; }
          var out = [];
          var seen = {};
          for (var i = 0; i < parsed.length && out.length < SAVED_MAX; i++) {
            var entry = parsed[i];
            if (!entry || typeof entry.id === 'undefined') { continue; }
            var id = String(entry.id);
            if (seen[id]) { continue; }
            seen[id] = true;
            out.push({
              id: id,
              title: entry.title || ('Article ' + id),
              url: entry.url || ('/news/a/' + id + '/'),
              ts: entry.ts || 0,
            });
          }
          return out;
        }

        function renderSaved() {
          var list = document.getElementById('savedList');
          var empty = document.getElementById('savedEmpty');
          var section = document.getElementById('saved');
          if (list) {
            while (list.firstChild) { list.removeChild(list.firstChild); }
          }
          var items = loadSaved();
          if (items.length === 0) {
            if (empty) { empty.hidden = false; }
            if (section) { section.hidden = true; }
            return;
          }
          if (empty) { empty.hidden = true; }
          if (section) { section.hidden = false; }
          items.forEach(function (item) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = '/news/a/' + item.id + '/';
            a.textContent = item.title;
            li.appendChild(a);
            if (list) { list.appendChild(li); }
          });
        }

        renderSaved();
      })();
    </script>
  </body>
</html>
